name: 日次収集

# 毎日やること:
#   0. 自己テスト            — 計算ロジックが壊れていないことを先に確かめる
#   1. お知らせ収集（主系統）— 各社公式の料金改定告知を蓄積する
#   2. 料金ページ収集（従系統）— 前日との差分をイベントとして記録する
#   3. 実質月額の算出         — 各社アダプタで意味づけし、統一計算式に通す
#   4. 収集元の死活監視      — 収集元が生きているかを確認する
#
# 死活監視を組み込んでいる理由:
#   自動収集の最悪の失敗は「静かに壊れること」。収集元がURL変更・bot遮断・構造変更を
#   起こしても気づかず、古い値を出し続けるのが一番まずい。
#   それは単なる不具合ではなく「事実と異なる情報」を出し続けることになる。

on:
  schedule:
    # 毎日 21:17 UTC = 翌 06:17 JST。
    # 毎時0分はGitHub Actions全体が混雑して遅延・スキップが起きやすいので意図的に外している。
    - cron: '17 21 * * *'
  workflow_dispatch:        # 手動実行。動作確認と、壊れたときの再実行に使う
  push:
    paths:
      - 'collect/**'        # 収集ロジックを触ったら即検証する
      - 'site/**'           # サイトの生成を触ったら即生成・検証・配信する
      - '.github/workflows/health.yml'

permissions:
  contents: write           # data/ を書き戻すために必要

concurrency:
  group: collect
  cancel-in-progress: false # データを書くジョブなので、途中で殺さない

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 依存パッケージを持たない方針なのでキャッシュ設定は不要

      # ★収集より先に走らせる。計算ロジックが壊れたまま収集すると
      #   間違った実質月額を data/ に書き込んでしまい、あとから真偽を判別できなくなる。
      - name: 自己テスト
        run: node --test collect/test.mjs

      - name: お知らせを収集する
        run: node collect/notices.mjs

      - name: 料金ページの差分を取る
        # お知らせ収集が失敗しても料金側は動かす（片方が壊れても収集を止めない）
        if: always()
        run: node collect/prices.mjs

      - name: 実質月額を算出する
        if: always()
        run: node collect/effective.mjs

      - name: 収集元の死活を確認する
        # お知らせ収集が失敗しても死活監視は実行する（何が壊れたか切り分けるため）
        if: always()
        run: node collect/health-check.mjs

      # ★生成と検証は必ずセットで動かす。検証を通らないものは公開しない。
      #   verify.mjs は生成されたHTMLを読み直して data/ と突き合わせるので、
      #   「サイトの数字とデータの数字が食い違う」状態で配信されることがない。
      - name: サイトを生成して検証する
        if: always()
        run: |
          node site/build.mjs
          node site/verify.mjs

      # ★2026-09-04: ここは以前「FTP_HOST が無ければ黙って飛ばす」だった。
      #   セットアップ前でもワークフローを壊さないための配慮だったが、
      #   **配信を飛ばしてもジョブが緑のまま**という抜け穴になっていた。
      #   実際 2026-08-30〜09-04 の6日間、収集は動き続けているのに公開サイトだけが
      #   止まっていたことに誰も気づけなかった。セットアップはとうに終わっているので、
      #   main で配信できないのは**事故**として扱う。赤くする。
      - name: 配信できるか確認する
        if: always()
        id: deploy_ready
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -n "$FTP_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### 配信できません: FTP_HOST が未設定です" >> "$GITHUB_STEP_SUMMARY"
            echo "Secrets の FTP_HOST が空です。サイトは更新されません。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "main 以外かつ FTP_HOST 未設定のため配信を飛ばします"
          fi

      - name: Xserver へ配信する
        # main 以外のブランチからは配信しない。検証用ブランチが本番を書き換えないため
        if: steps.deploy_ready.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          # サブFTPアカウントはアクセスディレクトリが起点になるので既定は "/"
          FTP_DIR: ${{ vars.FTP_REMOTE_DIR || '/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # ftp:ssl-force = 平文でのログインを許さない。証明書の検証も有効のままにする。
          # 検証を切ると FTPS にする意味がほぼ無くなるので、失敗したら原因を調べる。
          #
          # ★ .htaccess は転送も削除もしない（-X）。
          #   サーバー側の「HTTPS転送設定」がこのファイルに書き込む実装なのかは
          #   公式に明記されていない。--delete は生成物に無いファイルを消すので、
          #   除外しないと**初回の配信で常時SSLの設定を消してしまう**可能性がある。
          #   どちらの実装でも壊れない側に倒す。
          # ★同時接続は張らない（--parallel=1）。
          #   共用サーバーはアカウントあたりの同時FTP接続数を絞っていることがあり、
          #   2本張ると片方が蹴られて転送ごと失敗しうる。速度より確実さを取る。
          #   再試行の間隔も空ける（間を置かず叩き直すと締め出されやすい）。
          set +e
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ftp:passive-mode true;
            set net:max-retries 5;
            set net:reconnect-interval-base 10;
            set net:timeout 30;
            set mirror:parallel-transfer-count 1;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror -R --delete --verbose -X .htaccess -X .well-known/ site/dist/ '$FTP_DIR';
          " 2>&1 | tee /tmp/lftp.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "### 配信に失敗しました" >> "$GITHUB_STEP_SUMMARY"
            # 認証情報が混ざらないよう、ユーザー名とホスト名は伏せてから出す
            sed -e "s#$FTP_USER#***USER***#g" -e "s#$FTP_HOST#***HOST***#g" /tmp/lftp.log \
              | tail -40 >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      # ★配信したつもりで届いていない、を検出する唯一の手段。
      #   直前の生成物ではなく**公開URLを実際に取りに行って** data/ と突き合わせる。
      #   lftp が成功を返しても中身が古ければここで落ちる。
      #   2026-08-30〜09-04 の配信断は、この確認が無かったせいで6日間気づけなかった。
      - name: 公開サイトが実際に更新されたか確かめる
        if: steps.deploy_ready.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: |
          # 反映の取りこぼしを誤検知しないよう、間を置いて数回試す
          for i in 1 2 3; do
            if node site/verify.mjs https://tsushinhi-index.com/; then exit 0; fi
            echo "…$i 回目は不一致。20秒待って再確認します"
            sleep 20
          done
          echo "### 公開サイトが更新されていません" >> "$GITHUB_STEP_SUMMARY"
          echo "配信そのものは成功と報告されましたが、公開URLの内容が data/ と一致しません。" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 結果をコミットする
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # 変化がなければコミットしない（空コミットでログを汚さない）
          if git diff --staged --quiet; then
            echo "変化なし。コミットしません。"
          else
            git commit -m "日次収集: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 失敗した回の中身を残す。あとで「いつ何が壊れたか」を追えるようにする。
      - name: 失敗時のデータを保存する
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: data/
          if-no-files-found: ignore
